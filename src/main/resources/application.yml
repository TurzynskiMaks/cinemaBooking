spring:
  security:
    user:
      name: ${APP_USER:du}
      password: ${APP_PASSWORD:pa}
  web:
    resources:
      static-locations:
        - classpath:/static/
        - classpath:/public/
        - classpath:/META-INF/resources/
        - classpath:/META-INF/resources/webjars/
  datasource:
    url: jdbc:h2:file:./data/cinema;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
    driver-class-name: org.h2.Driver
    username: sa
    password:

  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true
    show-sql: true

  flyway:
    enabled: true

  h2:
    console:
      enabled: true
      path: /h2-console

  session:
    store-type: jdbc
    jdbc:
      initialize-schema: always

mail:
  api-key: ${MAIL_API_KEY:}
  base-url: ${MAIL_API_URL:}
springdoc:
  swagger-ui:
    enabled: true
  api-docs:
    path: /api-docs