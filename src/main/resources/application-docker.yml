server:
  port: 8080
spring:
  datasource:
    url: jdbc:h2:file:/data/cinema;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
    driver-class-name: org.h2.Driver
    username: ${H2_USERNAME:sa}
    password: ${H2_PASSWORD:}

  jpa:
    hibernate:
      ddl-auto: validate

  flyway:
    enabled: true

  session:
    store-type: jdbc
    jdbc:
      initialize-schema: always

  h2:
    console:
      enabled: true
      path: /h2-console

mail:
  api-key: ${MAIL_API_KEY:}
  base-url: ${MAIL_API_URL}