<!doctype html>
<html lang="pl" xmlns:th="http://www.thymeleaf.org">
<head><meta charset="UTF-8"><title>Admin - Statystyki</title></head>
<body>
<h1>Statystyki sprzedaży</h1>

<p><a href="/admin">← Admin</a></p>

<form method="get" action="/admin/stats">
    <label>Miesiąc (YYYY-MM)</label>
    <input name="month" th:value="${month}" placeholder="2026-01">
    <button type="submit">Pokaż</button>
</form>

<table border="1" cellpadding="6">
    <thead>
    <tr><th>Dzień</th><th>Liczba sprzedaży</th><th>Przychód (PLN)</th></tr>
    </thead>
    <tbody>
    <tr th:each="r : ${rows}">
        <td th:text="${r.day}"></td>
        <td th:text="${r.ticketsCount}"></td>
        <td th:text="${r.revenue}"></td>
    </tr>
    </tbody>
</table>

</body>
</html>
