<!doctype html>
<html lang="pl" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title th:text="${film.title}">Film</title>
</head>
<body>

<h1 th:text="${film.title}">Tytuł</h1>

<ul>
    <li><b>Gatunek:</b> <span th:text="${film.genre}"></span></li>
    <li><b>Ograniczenie wiekowe:</b> <span th:text="${film.ageRating}"></span>+</li>
    <li><b>Reżyser:</b> <span th:text="${film.director}"></span></li>
    <li><b>Obsada:</b> <span th:text="${film.castText}"></span></li>
</ul>

<h2>Zwiastun</h2>
<div th:if="${film.trailerUrl != null and !#strings.isEmpty(film.trailerUrl)}">
    <iframe width="560" height="315"
            th:src="${film.trailerUrl}"
            title="Trailer"
            frameborder="0"
            allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture"
            allowfullscreen>
    </iframe>
</div>
<div th:if="${film.trailerUrl == null or #strings.isEmpty(film.trailerUrl)}">
    <p>Brak zwiastuna.</p>
</div>

<h2>Galeria</h2>
<div>
    <div th:each="img : ${images}" style="display:inline-block; margin:8px;">
        <img th:src="${img.url}" alt="Image" width="260">
    </div>
</div>

<p><a href="/films">← Wróć do listy</a></p>

</body>
</html>
