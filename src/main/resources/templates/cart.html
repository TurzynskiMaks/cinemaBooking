<!doctype html>
<html lang="pl" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Koszyk</title>
</head>
<body>

<h1>Koszyk</h1>

<div th:if="${#lists.isEmpty(cart.items)}">
    <p>Koszyk jest pusty.</p>
</div>

<table th:if="${!#lists.isEmpty(cart.items)}" border="1" cellpadding="6">
    <thead>
    <tr>
        <th>Film</th>
        <th>Seans</th>
        <th>Miejsce</th>
        <th>Typ biletu</th>
        <th>Cena</th>
        <th>Akcje</th>
    </tr>
    </thead>

    <tbody>
    <tr th:each="it : ${cart.items}">
        <td th:text="${it.filmTitle}">Film</td>
        <td th:text="${#temporals.format(it.startTime, 'yyyy-MM-dd HH:mm')}">czas</td>
        <td th:text="'R' + ${it.rowNum} + ' M' + ${it.seatNum}">R1 M1</td>

        <td>
            <form method="post" action="/cart/update">
                <input type="hidden" name="key" th:value="${it.key}"/>

                <select name="ticketType">
                    <option th:each="t : ${ticketTypes}"
                            th:value="${t.name()}"
                            th:selected="${t.name() == it.ticketType.name()}"
                            th:text="${t.label}">
                    </option>
                </select>

                <button type="submit">Zmień</button>
            </form>
        </td>

        <td th:text="${it.unitPrice} + ' PLN'">35 PLN</td>

        <td>
            <form method="post" action="/cart/remove">
                <input type="hidden" name="key" th:value="${it.key}"/>
                <button type="submit">Usuń</button>
            </form>
        </td>
    </tr>
    </tbody>
</table>

<p><b>Suma:</b> <span th:text="${cart.total}"></span> PLN</p>
<p><a href="/checkout">Przejdź do płatności →</a></p>

<form method="post" action="/cart/clear">
    <button type="submit">Wyczyść koszyk</button>
</form>

<p><a href="/repertoire">← Wróć do repertuaru</a></p>

</body>
</html>
